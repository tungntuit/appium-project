# Env — đổi 1 dòng này để chạy đúng ngôn ngữ + platform
# Giá trị hợp lệ: androidVn / androidEng / iOSVn / iOSEng
# Override qua Maven: mvn test -Denv=androidEng
env=androidVn

# ── Device ─────────────────────────────────────────────────────────
device.name=Pixel_7_API_34
platform.version=14.0

# ── App ────────────────────────────────────────────────────────────
app.package=com.sacombankpay
app.activity=com.sacombankpay.MainActivity
android.app.path=src/test/resources/apps/SacombankPay.apk

# ── Appium server ──────────────────────────────────────────────────
appium.server.url=http://127.0.0.1:4723

# ── Credentials ────────────────────────────────────────────────────
sdt=0901234567
mpass=123456
identify.id=001234567890
dob=01/01/1990
hardcode.otp=123456

# ── Timing ─────────────────────────────────────────────────────────
wait.in.second=10

# ── Transfer ───────────────────────────────────────────────────────
transfer.money=500000
